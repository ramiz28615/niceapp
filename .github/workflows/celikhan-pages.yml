name: Deploy Çelikhan Çay Evi and LUMORA 3D to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "celikhan-cay-evi/**"
      - "lumora-3d/**"
      - ".github/workflows/celikhan-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage existing Çelikhan site and LUMORA 3D
        run: |
          mkdir -p _site/lumora-3d
          cp -a celikhan-cay-evi/. _site/
          cp -a lumora-3d/. _site/lumora-3d/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/lumora-3d/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
