<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07120d">
<title>Çelikhan Çay Evi</title>
<link rel="preconnect" href="https://images.unsplash.com">
<style>
:root{--bg:#f2f5f3;--panel:rgba(255,255,255,.9);--ink:#102019;--muted:#718078;--brand:#14914c;--brand2:#0a6838;--line:#dfe8e2;--shadow:0 14px 42px rgba(11,36,23,.10),0 2px 8px rgba(11,36,23,.06);--danger:#c72735}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(1000px 500px at -20% -10%,#d9f7e6 0,transparent 60%),radial-gradient(900px 480px at 110% 0%,#e6f3eb 0,transparent 58%),var(--bg);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:0 20px 110px}
.hero{position:sticky;top:0;z-index:30;margin:0 -20px;padding:18px 20px 16px;background:rgba(6,19,12,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 10px 40px rgba(0,0,0,.15)}.hero-inner{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:13px;color:#fff;min-width:0}.logo{width:52px;height:52px;border:1px solid rgba(228,190,104,.55);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1a2b20,#07100b);font-weight:900;color:#dcb95f;font-size:23px;box-shadow:inset 0 0 0 5px rgba(255,255,255,.025)}.brand h1{margin:0;font-size:clamp(18px,3.2vw,29px);letter-spacing:.08em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;color:#c6d2cb;letter-spacing:.16em;font-size:9px;margin-top:3px}.hero-actions{display:flex;gap:8px}.icon-btn{border:0;color:#fff;background:rgba(255,255,255,.1);width:43px;height:43px;border-radius:14px;display:grid;place-items:center;transition:.2s}.icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.16)}
.status{margin:22px 0 18px;padding:13px 16px;background:var(--panel);border:1px solid #fff;border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:10px;color:#42745a}.dot{width:11px;height:11px;border-radius:50%;background:#19a451;box-shadow:0 0 0 6px rgba(25,164,81,.11),0 0 18px rgba(25,164,81,.5);animation:pulse 1.8s infinite}@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(25,164,81,0),0 0 18px rgba(25,164,81,.7)}}
.topline{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:6px 0 14px}.topline h2{font-size:clamp(27px,4vw,39px);margin:0;letter-spacing:-.04em}.legend{display:flex;gap:12px;color:var(--muted);font-size:13px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}.l1 i{background:#fff;border:1px solid #bfc9c3}.l2 i{background:#eaf8ef;border:1px solid #5bb779}.l3 i{background:var(--brand)}
.table-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.table-card{position:relative;border:1px solid #e4ebe6;background:#fff;border-radius:17px;padding:18px 10px;min-height:74px;box-shadow:0 5px 16px rgba(15,46,29,.06);font-weight:800;font-size:20px;color:#18231d;transition:.18s}.table-card.available{background:linear-gradient(180deg,#f4fff7,#e9f8ef);border-color:#75c38f}.table-card.selected{color:#fff;background:linear-gradient(135deg,#1ca25a,#0a7b40);border-color:#0b783f;box-shadow:0 12px 26px rgba(13,137,73,.27);transform:translateY(-2px)}.table-card:hover{transform:translateY(-3px)}.mini{display:block;font-size:11px;font-weight:700;color:#c46f14;margin-top:4px}.table-card.selected .mini{color:#d6ffe5}
.workarea{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.75fr);gap:22px;align-items:start;margin-top:28px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.section-head h2{margin:0;font-size:clamp(25px,3vw,34px);letter-spacing:-.035em}.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:0 5px 18px rgba(15,46,29,.05)}.search input{border:0;outline:0;background:transparent;padding:11px 0;width:180px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 2px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none;border:1px solid var(--line);background:#fff;color:#506158;border-radius:999px;padding:9px 14px;font-weight:750}.chip.active{background:#13261d;color:#fff;border-color:#13261d}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.product{border:1px solid rgba(225,234,228,.9);background:rgba(255,255,255,.9);border-radius:22px;padding:14px;display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:14px;box-shadow:0 8px 22px rgba(15,46,29,.07);transition:.2s;overflow:hidden}.product:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(15,46,29,.11)}.product img{width:92px;height:82px;object-fit:cover;border-radius:16px;background:#e8eee9}.pname{font-size:18px;font-weight:850;margin-bottom:5px}.pmeta{font-size:12px;color:var(--muted);margin-bottom:7px}.price{font-weight:900;color:var(--brand2);font-size:18px}.add{width:42px;height:42px;border:0;border-radius:14px;background:#effaf3;color:#08743a;font-size:25px;box-shadow:inset 0 0 0 1px #cfe9d7;transition:.18s}.add:hover{background:var(--brand);color:#fff;transform:rotate(90deg)}
.cart{position:sticky;top:105px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid #fff;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.cart-head{padding:20px;border-bottom:1px solid #e8eee9;background:linear-gradient(135deg,#fff,#f3faf6)}.cart-title{display:flex;justify-content:space-between;align-items:center}.cart-title h3{margin:0;font-size:22px}.badge{padding:5px 10px;background:#e5f7ec;color:#08713a;border-radius:999px;font-weight:800;font-size:12px}.cart-sub{color:var(--muted);font-size:13px;margin-top:4px}.cart-list{max-height:365px;overflow:auto;padding:10px 14px}.empty{text-align:center;padding:34px 10px;color:#7c8b83}.empty .cup{font-size:38px;display:block;margin-bottom:10px}.cart-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 4px;border-bottom:1px dashed #dde6e0}.cart-row b{display:block}.cart-row small{color:#7a897f}.qty{display:flex;align-items:center;gap:7px}.qty button{border:0;width:28px;height:28px;border-radius:9px;background:#edf5f0;color:#154f32;font-weight:900}.sum{padding:15px 20px 20px;border-top:1px solid #e4ece6}.sumline{display:flex;justify-content:space-between;color:#67756d;margin-bottom:8px}.grand{display:flex;justify-content:space-between;align-items:end;font-size:16px;font-weight:800;margin:13px 0 15px}.grand strong{font-size:30px;color:#0b783f}.primary,.secondary{width:100%;border:0;border-radius:15px;padding:13px 16px;font-weight:850;transition:.18s}.primary{background:linear-gradient(135deg,#159551,#0b6f3b);color:#fff;box-shadow:0 10px 22px rgba(13,132,70,.24)}.primary:hover{transform:translateY(-2px);filter:brightness(1.05)}.primary:disabled{opacity:.42;cursor:not-allowed;transform:none}.secondary{margin-top:9px;background:#f1f5f2;color:#405046}.danger{color:var(--danger)!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#0b1710;color:#fff;padding:12px 17px;border-radius:13px;box-shadow:0 15px 40px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(4,12,8,.55);backdrop-filter:blur(8px);display:none;place-items:center;padding:20px}.modal.show{display:grid}.modal-card{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:26px;box-shadow:0 28px 80px rgba(0,0,0,.28);padding:22px}.receipt-head{text-align:center;padding:8px 0 18px;border-bottom:1px dashed #ccd8d0}.receipt-head .stamp{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#0f7440;color:#fff;font-weight:900;margin-bottom:8px}.receipt-items{padding:12px 0}.receipt-row{display:flex;justify-content:space-between;gap:15px;padding:7px 0}.receipt-total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;border-top:1px dashed #ccd8d0;padding-top:14px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.modal-actions button{border:0;padding:12px;border-radius:13px;font-weight:800}.close{background:#eef3ef}.pay{background:#0e7b43;color:#fff}.footer{padding:36px 0 10px;text-align:center;color:#87938d;font-size:12px}
@media(max-width:950px){.table-grid{grid-template-columns:repeat(4,1fr)}.workarea{grid-template-columns:1fr}.cart{position:relative;top:auto}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.app{padding:0 10px 95px}.hero{margin:0 -10px;padding:12px}.logo{width:43px;height:43px}.brand h1{font-size:20px;letter-spacing:.045em}.brand small{display:none}.status{margin:14px 0 15px}.legend{display:none}.table-grid{grid-template-columns:repeat(3,1fr);gap:8px}.table-card{min-height:58px;padding:13px 7px;font-size:16px;border-radius:13px}.workarea{margin-top:22px}.section-head{align-items:flex-start;flex-direction:column}.search{width:100%}.search input{width:100%}.products{grid-template-columns:1fr;gap:10px}.product{grid-template-columns:80px 1fr auto;border-radius:18px;padding:10px}.product img{width:80px;height:72px;border-radius:13px}.cart{border-radius:20px}.modal-card{border-radius:20px}}@media(max-width:370px){.table-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="hero-inner"><div class="brand"><div class="logo">Ç</div><div><h1>ÇELİKHAN ÇAY EVİ</h1><small>MASA & SİPARİŞ YÖNETİMİ</small></div></div><div class="hero-actions"><button class="icon-btn" id="full">⛶</button><button class="icon-btn" id="reset">↻</button></div></div></header>
<div class="status"><span class="dot"></span><b>Ortak sisteme bağlı</b><span id="sync">• Canlı senkron açık</span></div>
<div class="topline"><h2>Masa Seç</h2><div class="legend"><span class="l1"><i></i>Boş</span><span class="l2"><i></i>Açık masa</span><span class="l3"><i></i>Seçili</span></div></div>
<section class="table-grid" id="tables"></section>
<main class="workarea"><section><div class="section-head"><h2 id="title">Masa 21 — Ürün Ekle</h2><label class="search">⌕ <input id="search" placeholder="Ürün ara..."></label></div><div class="chips" id="chips"></div><div class="products" id="products"></div></section>
<aside class="cart"><div class="cart-head"><div class="cart-title"><h3>Aktif Hesap</h3><span class="badge" id="badge">Masa 21</span></div><div class="cart-sub" id="sub">Sipariş bekleniyor</div></div><div class="cart-list" id="cart"></div><div class="sum"><div class="sumline"><span>Ürün adedi</span><b id="count">0</b></div><div class="grand"><span>Toplam</span><strong id="total">0 TL</strong></div><button class="primary" id="save" disabled>Siparişi Kaydet</button><button class="secondary" id="receipt">Hesabı Görüntüle</button><button class="secondary danger" id="closeTable">Masayı Kapat</button></div></aside></main>
<footer class="footer"><b>Çelikhan Çay Evi</b> • Akıllı masa yönetimi • <span id="clock"></span></footer></div>
<div class="modal" id="modal"><div class="modal-card"><div class="receipt-head"><div class="stamp">Ç</div><h2 style="margin:0">Çelikhan Çay Evi</h2><div id="meta" style="color:#77847d;margin-top:5px"></div></div><div class="receipt-items" id="receiptItems"></div><div class="receipt-total"><span>Genel Toplam</span><span id="receiptTotal">0 TL</span></div><div class="modal-actions"><button class="close" id="modalClose">Kapat</button><button class="pay" id="paid">Ödeme Al & Kapat</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
var P=[
{id:"cay",name:"Çay",price:10,cat:"Sıcak",meta:"İnce belli bardak",img:"https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=360&q=82"},
{id:"su",name:"Su",price:10,cat:"Soğuk",meta:"Şişe su",img:"https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=360&q=82"},
{id:"kahve",name:"Türk Kahvesi",price:30,cat:"Sıcak",meta:"Köpüklü servis",img:"https://images.unsplash.com/photo-1512568400610-62da28bc8a13?auto=format&fit=crop&w=360&q=82"},
{id:"pogaca",name:"Poğaça",price:20,cat:"Atıştırmalık",meta:"Günlük taze",img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=360&q=82"},
{id:"kek",name:"Kek · Bisküvi",price:20,cat:"Atıştırmalık",meta:"Günün çeşidi",img:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=360&q=82"},
{id:"soda",name:"Soda",price:25,cat:"Soğuk",meta:"Maden suyu",img:"https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=360&q=82"},
{id:"kutu",name:"Kutu İçecek",price:60,cat:"Soğuk",meta:"Kola · Gazoz · Portakal",img:"https://images.unsplash.com/photo-1581636625402-29b2a704ef13?auto=format&fit=crop&w=360&q=82"},
{id:"soguk",name:"Soğuk Kahve",price:70,cat:"Kahve",meta:"Buzlu servis",img:"https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=360&q=82"},
{id:"sisecola",name:"Şişe Kola",price:40,cat:"Soğuk",meta:"Cam şişe",img:"https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=360&q=82"},
{id:"latte",name:"Latte",price:75,cat:"Kahve",meta:"Sütlü espresso",img:"https://images.unsplash.com/photo-1561882468-9110e03e0f78?auto=format&fit=crop&w=360&q=82"}
];
var KEY="celikhan-cay-evi-v3",selected=21,cat="Tümü",query="";
function emptyState(){var t={};for(var i=1;i<=23;i++)t[i]={items:{},saved:false};return {tables:t}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));return x&&x.tables?x:emptyState()}catch(e){return emptyState()}}
var state=load(),bc=("BroadcastChannel" in window)?new BroadcastChannel("celikhan-cay-evi"):null;
function $(s){return document.querySelector(s)}function money(n){return new Intl.NumberFormat("tr-TR").format(n)+" TL"}function items(n){return state.tables[n].items}function ncount(n){return Object.values(items(n)).reduce(function(a,b){return a+b},0)}function ntotal(n){return Object.keys(items(n)).reduce(function(s,id){var p=P.find(function(x){return x.id===id});return s+(p?p.price:0)*items(n)[id]},0)}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));if(bc)bc.postMessage(state);render()}
if(bc)bc.onmessage=function(e){state=e.data;render();$("#sync").textContent="• Az önce eşitlendi"};
function toast(x){var e=$("#toast");e.textContent=x;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("show")},1700)}
function renderTables(){var h="";for(var i=1;i<=23;i++){var c=ncount(i),cl=i===selected?"selected":(c?"available":"busy");h+='<button class="table-card '+cl+'" data-table="'+i+'">Masa '+i+'<span class="mini">'+(c?c+" ürün • "+money(ntotal(i)):"Boş")+"</span></button>"}$("#tables").innerHTML=h;document.querySelectorAll(".table-card").forEach(function(b){b.onclick=function(){selected=+b.dataset.table;render();scrollTo({top:0,behavior:"smooth"})}})}
function renderChips(){var cats=["Tümü"].concat(Array.from(new Set(P.map(function(p){return p.cat}))));$("#chips").innerHTML=cats.map(function(c){return '<button class="chip '+(c===cat?"active":"")+'" data-cat="'+c+'">'+c+"</button>"}).join("");document.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){cat=b.dataset.cat;renderProducts()}})}
function renderProducts(){var list=P.filter(function(p){return (cat==="Tümü"||p.cat===cat)&&p.name.toLocaleLowerCase("tr").includes(query)});$("#products").innerHTML=list.map(function(p){return '<article class="product"><img src="'+p.img+'" alt="'+p.name+'" loading="lazy"><div><div class="pname">'+p.name+'</div><div class="pmeta">'+p.meta+'</div><div class="price">'+money(p.price)+'</div></div><button class="add" data-id="'+p.id+'">+</button></article>'}).join("")||'<div class="empty" style="grid-column:1/-1">Ürün bulunamadı.</div>';document.querySelectorAll(".add").forEach(function(b){b.onclick=function(){add(b.dataset.id)}})}
function add(id){var t=state.tables[selected];t.items[id]=(t.items[id]||0)+1;t.saved=false;persist();toast("Ürün masaya eklendi")}
function change(id,d){var t=state.tables[selected];t.items[id]=(t.items[id]||0)+d;if(t.items[id]<=0)delete t.items[id];t.saved=false;persist()}
function renderCart(){var en=Object.entries(items(selected));$("#cart").innerHTML=en.length?en.map(function(e){var id=e[0],q=e[1],p=P.find(function(x){return x.id===id});return '<div class="cart-row"><div><b>'+p.name+'</b><small>'+money(p.price)+" × "+q+" = "+money(p.price*q)+'</small></div><div class="qty"><button data-id="'+id+'" data-d="-1">−</button><b>'+q+'</b><button data-id="'+id+'" data-d="1">+</button></div></div>'}).join(""):'<div class="empty"><span class="cup">☕</span>Bu masada henüz ürün yok.<br>Ürün kartındaki <b>+</b> düğmesine dokun.</div>';document.querySelectorAll(".qty button").forEach(function(b){b.onclick=function(){change(b.dataset.id,+b.dataset.d)}});var c=ncount(selected);$("#count").textContent=c;$("#total").textContent=money(ntotal(selected));$("#badge").textContent="Masa "+selected;$("#sub").textContent=c?(c+" ürün • "+(state.tables[selected].saved?"Sipariş kaydedildi":"Kaydedilmemiş değişiklik")):"Sipariş bekleniyor";$("#save").disabled=!c;$("#title").textContent="Masa "+selected+" — Ürün Ekle"}
function render(){renderTables();renderChips();renderProducts();renderCart()}
$("#search").oninput=function(e){query=e.target.value.toLocaleLowerCase("tr").trim();renderProducts()};
$("#save").onclick=function(){if(!ncount(selected))return;state.tables[selected].saved=true;persist();toast("Masa "+selected+" siparişi kaydedildi ✓")};
function openReceipt(){var en=Object.entries(items(selected));$("#meta").textContent="Masa "+selected+" • "+new Date().toLocaleString("tr-TR");$("#receiptItems").innerHTML=en.length?en.map(function(e){var p=P.find(function(x){return x.id===e[0]});return '<div class="receipt-row"><span>'+e[1]+" × "+p.name+"</span><b>"+money(e[1]*p.price)+"</b></div>"}).join(""):'<div class="empty">Hesap boş.</div>';$("#receiptTotal").textContent=money(ntotal(selected));$("#modal").classList.add("show")}
$("#receipt").onclick=openReceipt;$("#modalClose").onclick=function(){$("#modal").classList.remove("show")};$("#modal").onclick=function(e){if(e.target.id==="modal")e.currentTarget.classList.remove("show")};
function closeTable(){if(!ncount(selected)){toast("Masa zaten boş");return}if(confirm("Masa "+selected+" hesabı kapatılsın mı?")){state.tables[selected]={items:{},saved:false};persist();$("#modal").classList.remove("show");toast("Masa "+selected+" kapatıldı")}}
$("#closeTable").onclick=closeTable;$("#paid").onclick=closeTable;
$("#reset").onclick=function(){if(confirm("Tüm masa ve sipariş verileri sıfırlansın mı?")){state=emptyState();persist();toast("Tüm masalar sıfırlandı")}};
$("#full").onclick=function(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()};
setInterval(function(){$("#clock").textContent=new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})},1000);render();
</script>
</body>
</html>
