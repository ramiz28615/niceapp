<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çelikhan Çay Evi - Masa Takip</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f4;color:#142019}
header{background:#08180f;color:white;padding:18px;text-align:center;position:sticky;top:0}
.wrap{max-width:1000px;margin:auto;padding:16px}.tables{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.table{border:1px solid #dfe8e2;background:#fff;border-radius:14px;padding:16px 8px;font-weight:700}.table.active{background:#0d8748;color:#fff}
.panel{margin-top:20px;display:grid;grid-template-columns:2fr 1fr;gap:16px}.card{background:#fff;border:1px solid #dfe8e2;border-radius:16px;padding:16px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prod{display:flex;justify-content:space-between;align-items:center;border:1px solid #e4ebe7;border-radius:12px;padding:12px}.prod button,.qty button{border:0;background:#0d8748;color:#fff;border-radius:9px;padding:8px 11px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #ddd}.qty{display:flex;gap:6px;align-items:center}
.total{font-size:24px;font-weight:900;margin-top:12px}.clear{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:#b72f3a;color:#fff;font-weight:700}
@media(max-width:800px){.tables{grid-template-columns:repeat(3,1fr)}.panel{grid-template-columns:1fr}.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h2 style="margin:0">ÇELİKHAN ÇAY EVİ • MASA TAKİP</h2></header>
<div class="wrap">
<div class="tables" id="tables"></div>
<div class="panel">
<div class="card"><h3 id="title">Masa 1 - Ürün Ekle</h3><div class="products" id="products"></div></div>
<div class="card"><h3>Aktif Hesap</h3><div id="cart"></div><div class="total" id="total">0 TL</div><button class="clear" id="clear">Masayı Kapat</button></div>
</div></div>
<script>
const P=[["Çay",10],["Su",10],["Türk Kahvesi",30],["Poğaça",20],["Kek / Bisküvi",20],["Soda",25],["Kutu İçecek",60],["Soğuk Kahve",70],["Şişe Kola",40],["Latte",75]];
let selected=1;
let state=JSON.parse(localStorage.getItem("celikhan-simple-v1")||"null");
if(!state){state={};for(let i=1;i<=23;i++)state[i]={}}
function save(){localStorage.setItem("celikhan-simple-v1",JSON.stringify(state));render()}
function render(){
 const t=document.getElementById("tables");t.innerHTML="";
 for(let i=1;i<=23;i++){const b=document.createElement("button");b.className="table"+(i===selected?" active":"");let c=Object.values(state[i]).reduce((a,b)=>a+b,0);b.textContent="Masa "+i+(c?" • "+c+" ürün":"");b.onclick=()=>{selected=i;render()};t.appendChild(b)}
 document.getElementById("title").textContent="Masa "+selected+" - Ürün Ekle";
 document.getElementById("products").innerHTML=P.map((p,i)=>'<div class="prod"><span>'+p[0]+' - '+p[1]+' TL</span><button onclick="add('+i+')">+</button></div>').join("");
 let html="",sum=0;Object.entries(state[selected]).forEach(([i,q])=>{let p=P[i];sum+=p[1]*q;html+='<div class="row"><span>'+p[0]+' x '+q+'</span><div class="qty"><button onclick="chg('+i+',-1)">-</button><b>'+q+'</b><button onclick="chg('+i+',1)">+</button></div></div>'});
 document.getElementById("cart").innerHTML=html||"<p>Bu masa boş.</p>";document.getElementById("total").textContent=sum+" TL";
}
function add(i){state[selected][i]=(state[selected][i]||0)+1;save()}
function chg(i,d){state[selected][i]=(state[selected][i]||0)+d;if(state[selected][i]<=0)delete state[selected][i];save()}
document.getElementById("clear").onclick=()=>{state[selected]={};save()};render();
</script>
</body></html>
