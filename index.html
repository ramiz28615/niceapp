<style>
:root{--bg:#05070b;--panel:#0a111ddd;--line:#ffffff18;--text:#f7f9ff;--muted:#94a3bb;--cyan:#64eaff;--violet:#9b7fff;--gold:#ffc95f;--red:#ff647d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;touch-action:none}button,input,select{font:inherit}#app{position:fixed;inset:0}canvas{display:block}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;display:none}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand,.actions,.catalog,.detail,.hud,.floating{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:15px;background:var(--panel);backdrop-filter:blur(16px)}
.logo{width:34px;height:34px;border:1px solid #ffffff24;border-radius:11px;background:linear-gradient(145deg,#64eaff33,#9b7fff33);position:relative}.logo:after{content:"";position:absolute;inset:8px;border:2px solid var(--cyan);border-radius:4px;transform:rotate(45deg)}
.brand b{font-size:11px;letter-spacing:.1em}.brand small{display:block;color:var(--muted);font-size:7px;margin-top:2px}.actions{display:flex;gap:5px}
button{border:1px solid var(--line);background:#0a111ddd;color:#fff;border-radius:12px;padding:10px 11px;font-size:8px;font-weight:850;backdrop-filter:blur(14px)}button.primary{border:0;color:#061014;background:linear-gradient(135deg,var(--cyan),#aab8ff)}
.hud{position:absolute;top:64px;left:10px;right:10px;display:flex;justify-content:center;gap:6px}.hud div{padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:8px;color:#9fb0c7}.hud b{color:#fff}
.tip{position:absolute;top:99px;left:50%;transform:translateX(-50%);padding:7px 10px;border:1px solid #ffffff14;border-radius:16px;background:#050810b5;color:#aec0d8;font-size:8px;white-space:nowrap}
.floating{position:absolute;top:100px;left:10px;right:10px;display:flex;justify-content:space-between}
.detail{position:absolute;left:50%;top:137px;transform:translateX(-50%);width:min(550px,94vw);max-height:calc(100vh - 340px);overflow:auto;background:#08101bf0;border:1px solid var(--line);border-radius:18px;padding:12px;backdrop-filter:blur(18px)}
.detail h2{font-size:19px;margin:0 0 5px}.tag{display:inline-block;padding:3px 6px;border-radius:8px;background:#ffffff0e;color:#d9e3f3;font-size:7px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 0}.metric{padding:8px;border-radius:10px;background:#ffffff08;border:1px solid #ffffff0b}.metric small{display:block;color:#7e8da7;font-size:7px}.metric b{font-size:13px}.detail p{font-size:9px;color:#b3c0d1;line-height:1.55;margin:7px 0}.detail ul{padding-left:16px}.detail li{font-size:8px;color:#9faec4;margin:3px 0}.detailActions{display:flex;gap:6px;margin-top:9px}.detailActions button{flex:1}
.catalog{position:absolute;left:8px;right:8px;bottom:8px;height:188px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:9px;backdrop-filter:blur(18px)}.tools{display:flex;gap:6px;margin-bottom:8px}.tools input,.tools select{height:34px;border-radius:10px;border:1px solid var(--line);background:#101827;color:#fff;padding:0 9px;font-size:8px}.tools input{flex:1}.cards{display:flex;gap:7px;overflow-x:auto;height:136px}.card{flex:0 0 150px;text-align:left;padding:8px;border-radius:13px;border:1px solid #ffffff18;background:linear-gradient(160deg,#192640,#0b111c)}.card.sel{border-color:var(--cyan);box-shadow:0 0 0 1px #64eaff55 inset}.card b{display:block;font-size:11px;margin-bottom:4px}.card span{display:block;font-size:8px;color:#aab6c9;margin:2px 0}.card .stat{font-weight:900;color:#fff}
.modal{position:fixed;inset:0;z-index:30;background:#02040af0;display:grid;place-items:center;padding:15px;pointer-events:auto}.hidden{display:none!important}.modalBox{width:min(980px,96vw);max-height:94vh;overflow:auto;background:#0a111d;border:1px solid var(--line);border-radius:20px;padding:12px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.modalBox img{width:100%;display:block;border-radius:14px}.typeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.typeCard{padding:10px;border:1px solid var(--line);border-radius:12px;background:#ffffff06}.typeCard b{font-size:11px}.typeCard li{font-size:8px;color:#9eabc0;margin:3px 0}
@media(max-width:700px){.brand small{display:none}.actions button{padding:9px}.detail{top:139px;max-height:calc(100vh - 350px)}.catalog{height:180px}.cards{height:128px}}

const $=id=>document.getElementById(id);let selected=0,isAR=false,hitSource=null,hitRequested=false,lastHit=new THREE.Matrix4();
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070b);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.02,100);camera.position.set(0,1.5,4);
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:true,powerPreference:"high-performance"});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.xr.enabled=true;$("app").appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x171226,2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(3,7,3);scene.add(dl);
const ret=new THREE.Mesh(new THREE.RingGeometry(.08,.12,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x64eaff}));ret.matrixAutoUpdate=false;ret.visible=false;scene.add(ret);const monsters=[];
const color=a=>({LIGHT:0xeef9ff,DARK:0x7658ff,FIRE:0xff6848,WIND:0x5fe8be,WATER:0x4b9dff,DIVINE:0xffd05a}[a]||0x64eaff);
function build(c){const g=new THREE.Group(),col=color(c.attribute),m=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.28,metalness:.5,roughness:.35});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.72,4,8),m);body.position.y=.72;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.19,12,8),new THREE.MeshStandardMaterial({color:0xffffff,emissive:col,emissiveIntensity:.2}));head.position.y=1.32;g.add(head);const aura=new THREE.Mesh(new THREE.TorusGeometry(.43,.025,6,30),new THREE.MeshBasicMaterial({color:col}));aura.rotation.x=Math.PI/2;aura.position.y=.28;aura.userData.spin=1;g.add(aura);return g}
function summon(){const c=data[selected],g=build(c),p=new THREE.Vector3();if(isAR&&ret.visible){lastHit.decompose(p,g.quaternion,new THREE.Vector3());g.position.copy(p)}else{camera.getWorldDirection(p);p.multiplyScalar(2.1).add(camera.position);p.y=.08;g.position.copy(p)}g.scale.setScalar(.01);scene.add(g);let s=0;g.userData.tick=()=>{s=Math.min(1,s+.07);g.scale.setScalar(THREE.MathUtils.smoothstep(s,0,1));g.rotation.y+=(1-s)*.18;if(s>=1)delete g.userData.tick};monsters.push(g);$("tip").textContent=c.name+" çağrıldı"}
function renderDetail(){const c=data[selected];$("selHud").textContent=c.name;$("detail").innerHTML='<h2>'+c.name+'</h2><span class="tag">'+c.type+'</span><div class="row"><div class="metric"><small>ATTRIBUTE</small><b>'+c.attribute+'</b></div><div class="metric"><small>LEVEL/RANK/LINK</small><b>'+c.level+'</b></div><div class="metric"><small>KULLANICI</small><b style="font-size:10px">'+(c.owner||"-")+'</b></div></div><div class="row"><div class="metric"><small>ATK</small><b>'+c.atk+'</b></div><div class="metric"><small>DEF</small><b>'+c.def+'</b></div><div class="metric"><small>MOD</small><b>3B AR</b></div></div>'+(c.effect?'<p><b>Özellik:</b> '+c.effect+'</p>':'')+(c.style?'<p><b>Oyun Tarzı:</b> '+c.style+'</p>':'')+(c.supports?'<p><b>Destekler:</b> '+c.supports+'</p>':'')+(c.material?'<p><b>Materyal:</b> '+c.material+'</p>':'')+(c.theme?'<p><b>Tema:</b> '+c.theme+'</p>':'')+(c.role?'<p><b>Rol:</b> '+c.role+'</p>':'')+'<div class="detailActions"><button class="primary" id="dSummon">3B ÇAĞIR</button></div>';$("dSummon").onclick=summon}
function renderCards(){const q=$("search").value.toLowerCase(),f=$("filter").value,box=$("cards");box.innerHTML="";data.forEach((c,i)=>{if(q&&!c.name.toLowerCase().includes(q))return;if(f&&!c.type.includes(f))return;const b=document.createElement("button");b.className="card"+(i===selected?" sel":"");b.innerHTML="<b>"+c.name+"</b><span class='tag'>"+c.attribute+"</span><span>"+c.type+"</span><span class='stat'>ATK "+c.atk+" • DEF "+c.def+"</span><span>"+(c.owner||"")+"</span>";b.onclick=()=>{selected=i;renderCards();renderDetail()};box.appendChild(b)})}

async function startAR(){if(!navigator.xr){$("tip").textContent="WebXR yok — 3B modda devam edebilirsin";return}const ok=await navigator.xr.isSessionSupported("immersive-ar").catch(()=>false);if(!ok){$("tip").textContent="Bu cihaz immersive-ar desteklemiyor";return}const s=await navigator.xr.requestSession("immersive-ar",{requiredFeatures:["hit-test"],optionalFeatures:["dom-overlay","local-floor"],domOverlay:{root:document.body}});await renderer.xr.setSession(s)}
$("ar").onclick=startAR;renderer.xr.addEventListener("sessionstart",()=>{isAR=true;scene.background=null});renderer.xr.addEventListener("sessionend",()=>{isAR=false;hitSource=null;hitRequested=false;ret.visible=false;scene.background=new THREE.Color(0x05070b)});
$("camera").onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});$("cam").srcObject=s;$("cam").style.display="block";scene.background=null;$("tip").textContent="Arka kamera açıldı • 3B fallback aktif"}catch{$("tip").textContent="Kamera izni gerekli"}};
function updateXR(frame){if(!isAR||!frame)return;const session=renderer.xr.getSession(),ref=renderer.xr.getReferenceSpace();if(!hitRequested){session.requestReferenceSpace("viewer").then(v=>session.requestHitTestSource({space:v}).then(src=>hitSource=src));hitRequested=true}if(hitSource){const h=frame.getHitTestResults(hitSource);if(h.length){const pose=h[0].getPose(ref);ret.visible=true;ret.matrix.fromArray(pose.transform.matrix);lastHit.copy(ret.matrix)}else ret.visible=false}}
const clock=new THREE.Clock();renderer.setAnimationLoop((t,f)=>{const dt=Math.min(clock.getDelta(),.033);updateXR(f);monsters.forEach(g=>{g.children.forEach(c=>{if(c.userData.spin)c.rotation.z+=dt});if(g.userData.tick)g.userData.tick()});renderer.render(scene,camera)});addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)});renderCards();renderDetail();
