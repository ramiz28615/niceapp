<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çelikhan Çay Evi Menü</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#142019}
header{background:#08180f;color:#fff;padding:24px 16px;text-align:center}
h1{margin:0 0 6px;font-size:28px}.sub{color:#c6d4cb;font-size:13px}
.wrap{max-width:760px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:#fff;border:1px solid #e1e8e3;border-radius:16px;padding:16px;display:flex;justify-content:space-between;gap:16px;box-shadow:0 8px 22px rgba(0,0,0,.06)}
.name{font-weight:700}.price{font-weight:900;color:#0b7a41;white-space:nowrap}
.qr{margin:22px auto 0;background:#fff;border:1px solid #e1e8e3;border-radius:16px;padding:18px;text-align:center}
.qr img{width:220px;max-width:100%;height:auto}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>ÇELİKHAN ÇAY EVİ</h1><div class="sub">MENÜ & GÜNCEL FİYATLAR</div></header>
<main class="wrap">
<section class="grid">
<div class="item"><span class="name">Çay</span><span class="price">10 TL</span></div>
<div class="item"><span class="name">Su</span><span class="price">10 TL</span></div>
<div class="item"><span class="name">Türk Kahvesi</span><span class="price">30 TL</span></div>
<div class="item"><span class="name">Poğaça</span><span class="price">20 TL</span></div>
<div class="item"><span class="name">Kek / Bisküvi</span><span class="price">20 TL</span></div>
<div class="item"><span class="name">Soda</span><span class="price">25 TL</span></div>
<div class="item"><span class="name">Kutu İçecek</span><span class="price">60 TL</span></div>
<div class="item"><span class="name">Soğuk Kahve</span><span class="price">70 TL</span></div>
<div class="item"><span class="name">Şişe Kola</span><span class="price">40 TL</span></div>
<div class="item"><span class="name">Latte</span><span class="price">75 TL</span></div>
</section>
<section class="qr"><h3>QR Menü</h3><p>Telefon kamerasıyla okut.</p><img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=https%3A%2F%2Framiz28615.github.io%2Fniceapp%2F" alt="QR Menü"></section>
</main>
</body></html>
