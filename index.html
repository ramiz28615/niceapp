$("ar").onclick=startAR;$("vr").onclick=async()=>{if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;$("cam").srcObject=null;$("cam").style.display="none"}if(navigator.xr&&await navigator.xr.isSessionSupported("immersive-vr").catch(()=>false)){try{const s=await navigator.xr.requestSession("immersive-vr",{optionalFeatures:["local-floor"]});await renderer.xr.setSession(s);return}catch(e){}}stereo=true;$("vrExit").style.display="inline-block";scene.background=new THREE.Color(0x05070b);tip("VR fallback aktif — ekran iki göze bölündü")};$("vrExit").onclick=()=>{stereo=false;$("vrExit").style.display="none";$("mode3d").click()};renderer.xr.addEventListener("sessionstart",()=>{isAR=true;scene.background=null;tip("AR aktif — telefonu yüzeye doğru hareket ettir")});renderer.xr.addEventListener("sessionend",()=>{isAR=false;hitSource=null;hitRequested=false;ret.visible=false;scene.background=new THREE.Color(0x05070b)});
function updateXR(frame){if(!isAR||!frame)return;const session=renderer.xr.getSession(),ref=renderer.xr.getReferenceSpace();if(!hitRequested){session.requestReferenceSpace("viewer").then(v=>session.requestHitTestSource({space:v}).then(src=>hitSource=src));hitRequested=true}if(hitSource){const h=frame.getHitTestResults(hitSource);if(h.length){const pose=h[0].getPose(ref);ret.visible=true;ret.matrix.fromArray(pose.transform.matrix);lastHit.copy(ret.matrix);const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();lastHit.decompose(p,q,s);arena.position.lerp(p,.08);arena.quaternion.slerp(q,.08)}else ret.visible=false}}

let dragging=false,lastX=0,lastY=0,yaw=0,pitch=-.18;renderer.domElement.addEventListener("pointerdown",e=>{if(isAR)return;dragging=true;lastX=e.clientX;lastY=e.clientY});addEventListener("pointerup",()=>dragging=false);addEventListener("pointermove",e=>{if(!dragging||isAR)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.003;pitch=Math.max(-.65,Math.min(.45,pitch-dy*.0025))});
const clock=new THREE.Clock(),leftCam=new THREE.PerspectiveCamera(),rightCam=new THREE.PerspectiveCamera();renderer.setAnimationLoop((t,f)=>{const dt=Math.min(clock.getDelta(),.033);if(!isAR&&!isVR){camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch}updateXR(f);[...pSlots,...eSlots].forEach(s=>{if(s.m){s.m.children.forEach(c=>{if(c.userData.spin)c.rotation.z+=dt});if(s.m.userData.tick)s.m.userData.tick();s.m.position.y=.03+Math.sin(t*.002+s.m.id)*.015}});if(stereo&&!renderer.xr.isPresenting){const w=innerWidth,h=innerHeight;renderer.setScissorTest(true);leftCam.copy(camera);rightCam.copy(camera);leftCam.aspect=(w/2)/h;rightCam.aspect=(w/2)/h;leftCam.updateProjectionMatrix();rightCam.updateProjectionMatrix();leftCam.translateX(-.035);rightCam.translateX(.035);renderer.setViewport(0,0,w/2,h);renderer.setScissor(0,0,w/2,h);renderer.render(scene,leftCam);renderer.setViewport(w/2,0,w/2,h);renderer.setScissor(w/2,0,w/2,h);renderer.render(scene,rightCam);renderer.setScissorTest(false);renderer.setViewport(0,0,w,h)}else renderer.render(scene,camera)});
